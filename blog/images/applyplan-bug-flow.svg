<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="390" y="25" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">The applyPlan() Bug — What Looked Right Wasn't</text>

  <!-- BUGGY path (top) -->
  <text x="30" y="62" font-size="12" font-weight="600" fill="#dc2626">✗ Before fix</text>

  <rect x="30" y="72" width="140" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="100" y="90" text-anchor="middle" font-size="11" fill="#991b1b">BridgeProvisioner</text>
  <text x="100" y="104" text-anchor="middle" font-size="10" fill="#b91c1c">provision()</text>

  <line x1="170" y1="93" x2="208" y2="93" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrRed)"/>

  <rect x="210" y="72" width="120" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="270" y="90" text-anchor="middle" font-size="11" fill="#991b1b">plan()</text>
  <text x="270" y="104" text-anchor="middle" font-size="10" fill="#b91c1c">--check mode</text>

  <line x1="330" y1="93" x2="368" y2="93" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrRed)"/>

  <rect x="370" y="72" width="120" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="430" y="90" text-anchor="middle" font-size="11" fill="#991b1b">applyPlan()</text>
  <text x="430" y="104" text-anchor="middle" font-size="10" fill="#b91c1c">returns cached</text>

  <line x1="490" y1="93" x2="528" y2="93" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrRed)"/>

  <rect x="530" y="72" width="120" height="42" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="590" y="90" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Success({})</text>
  <text x="590" y="104" text-anchor="middle" font-size="10" fill="#dc2626">empty state!</text>

  <line x1="650" y1="93" x2="688" y2="93" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrRed)"/>

  <rect x="690" y="68" width="70" height="50" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="725" y="88" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Resource</text>
  <text x="725" y="101" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">NEVER</text>
  <text x="725" y="113" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">created</text>

  <!-- Annotation for bug -->
  <rect x="370" y="122" width="280" height="30" rx="4" fill="#fff7ed" stroke="#f97316" stroke-width="1"/>
  <text x="510" y="142" text-anchor="middle" font-size="11" fill="#c2410c">Cached check-mode result returned as real output.</text>
  <text x="510" y="155" text-anchor="middle" font-size="11" fill="#c2410c">No ansible-playbook execution happens.</text>

  <!-- Divider -->
  <line x1="30" y1="175" x2="760" y2="175" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6 3"/>

  <!-- FIXED path (bottom) -->
  <text x="30" y="208" font-size="12" font-weight="600" fill="#16a34a">✓ After fix</text>

  <rect x="30" y="218" width="140" height="42" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="100" y="236" text-anchor="middle" font-size="11" fill="#166534">BridgeProvisioner</text>
  <text x="100" y="250" text-anchor="middle" font-size="10" fill="#15803d">provision()</text>

  <line x1="170" y1="239" x2="208" y2="239" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrGreen)"/>

  <rect x="210" y="218" width="120" height="42" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="270" y="236" text-anchor="middle" font-size="11" fill="#166534">plan()</text>
  <text x="270" y="250" text-anchor="middle" font-size="10" fill="#15803d">--check + store req</text>

  <line x1="330" y1="239" x2="368" y2="239" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrGreen)"/>

  <rect x="370" y="218" width="120" height="42" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="430" y="236" text-anchor="middle" font-size="11" fill="#166534">applyPlan()</text>
  <text x="430" y="250" text-anchor="middle" font-size="10" fill="#15803d">delegates to apply()</text>

  <line x1="490" y1="239" x2="528" y2="239" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrGreen)"/>

  <rect x="530" y="218" width="120" height="42" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="590" y="236" text-anchor="middle" font-size="11" fill="#166534">apply()</text>
  <text x="590" y="250" text-anchor="middle" font-size="10" fill="#15803d">real execution</text>

  <line x1="650" y1="239" x2="688" y2="239" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrGreen)"/>

  <rect x="690" y="214" width="70" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="725" y="234" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Resource</text>
  <text x="725" y="247" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">created</text>
  <text x="725" y="260" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">✓</text>

  <!-- Annotation for fix -->
  <rect x="370" y="268" width="280" height="30" rx="4" fill="#ecfdf5" stroke="#34d399" stroke-width="1"/>
  <text x="510" y="288" text-anchor="middle" font-size="11" fill="#065f46">AnsiblePlanContext stores original BridgeRequest.</text>
  <text x="510" y="301" text-anchor="middle" font-size="11" fill="#065f46">applyPlan() re-executes with real ansible-playbook.</text>

  <!-- Caption -->
  <text x="390" y="332" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">The check-mode result looked like success. The resource was never provisioned.</text>
</svg>
