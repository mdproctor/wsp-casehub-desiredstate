<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="40" y="60" width="720" height="200" rx="12" fill="url(#spectrum)" stroke="#94a3b8" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">CaseHub Infrastructure Authorship Spectrum</text>

  <!-- Three columns -->
  <!-- Zero-Code -->
  <rect x="60" y="80" width="210" height="160" rx="8" fill="white" fill-opacity="0.85" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">Zero-Code</text>
  <text x="165" y="128" text-anchor="middle" font-size="11" fill="#475569">Terraform Bridge</text>
  <line x1="85" y1="140" x2="245" y2="140" stroke="#e2e8f0" stroke-width="1"/>
  <text x="165" y="160" text-anchor="middle" font-size="11" fill="#334155">Point at a provider binary.</text>
  <text x="165" y="178" text-anchor="middle" font-size="11" fill="#334155">Auto-discover every type.</text>
  <text x="165" y="196" text-anchor="middle" font-size="11" fill="#334155">No manifests. No code.</text>
  <text x="165" y="220" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">hashicorp/aws → 1000+ types</text>

  <!-- Low-Code -->
  <rect x="295" y="80" width="210" height="160" rx="8" fill="white" fill-opacity="0.85" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">Low-Code</text>
  <text x="400" y="128" text-anchor="middle" font-size="11" fill="#475569">YAML Plugins</text>
  <line x1="320" y1="140" x2="480" y2="140" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="160" text-anchor="middle" font-size="11" fill="#334155">Step pipelines in YAML.</text>
  <text x="400" y="178" text-anchor="middle" font-size="11" fill="#334155">Approval gates, validation.</text>
  <text x="400" y="196" text-anchor="middle" font-size="11" fill="#334155">Custom fault policies.</text>
  <text x="400" y="220" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">Extend or wrap bridge types</text>

  <!-- Full-Code -->
  <rect x="530" y="80" width="210" height="160" rx="8" fill="white" fill-opacity="0.85" stroke="#dc2626" stroke-width="2"/>
  <text x="635" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Full-Code</text>
  <text x="635" y="128" text-anchor="middle" font-size="11" fill="#475569">Java SPI Plugins</text>
  <line x1="555" y1="140" x2="715" y2="140" stroke="#e2e8f0" stroke-width="1"/>
  <text x="635" y="160" text-anchor="middle" font-size="11" fill="#334155">Implement SPIs directly.</text>
  <text x="635" y="178" text-anchor="middle" font-size="11" fill="#334155">Complete control.</text>
  <text x="635" y="196" text-anchor="middle" font-size="11" fill="#334155">Custom provisioners.</text>
  <text x="635" y="220" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">Full reconciliation loop</text>

  <!-- Arrows between -->
  <text x="277" y="170" text-anchor="middle" font-size="18" fill="#94a3b8">→</text>
  <text x="512" y="170" text-anchor="middle" font-size="18" fill="#94a3b8">→</text>

  <!-- Bottom label -->
  <text x="400" y="295" text-anchor="middle" font-size="11" fill="#64748b">All three tiers share the same reconciliation loop: drift detection, fault escalation, CBR, lifecycle management</text>
</svg>
